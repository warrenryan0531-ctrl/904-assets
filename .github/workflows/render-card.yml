name: Render quote card
on:
  push:
    branches: [main]
    paths: ['instagram/cards/*.json']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Render changed specs
        run: |
          set -e
          specs=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'instagram/cards/*.json' || true)
          [ -n "$specs" ] || specs=$(ls instagram/cards/*.json)
          python tools/render_card.py $specs
          git config user.name "904-assets-bot"
          git config user.email "actions@github.com"
          git add instagram/*.png
          git commit -m "Render quote card(s)" || exit 0
          git push
